name: Connected Delivery source QA
on:
  pull_request:
    paths:
      - 'connected-delivery/**'
      - 'p5/**'
      - 'tests/connected-delivery.test.cjs'
      - '.github/workflows/connected-delivery-qa.yml'
  workflow_dispatch:
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/connected-delivery.test.cjs
