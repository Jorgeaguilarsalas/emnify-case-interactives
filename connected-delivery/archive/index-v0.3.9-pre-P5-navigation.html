<div class="filterbar matrix-filters">${globalSourceBar()}<label class="matrix-toggle"><input type="checkbox" aria-label="Show analytical associations" ${CURRENT.modelOverlay?'checked':''} onchange="toggleModelOverlay()"/ title="Enable M/H analytical links as an explicit overlay"> Model links</label>${['J6','J6_core','J6_touch','J7_core','J7_touch'].includes(CURRENT.scope)?`<label>Process focus <select aria-label="Stage process focus" onchange="CURRENT.focus=this.value;CURRENT.page=0;CURRENT.detail=null;CURRENT.selected=null;render(false);writeHash()"><option value="all" ${CURRENT.focus==='all'?'selected':''}>All core processes</option>${(CURRENT.scope.startsWith('J7')?['PR23','PR24','PR25','PR26','PR27','PR28','PR29']:['PR21','PR22']).map(id=>`<option value="${id}" ${CURRENT.focus===id?'selected':''}>${id} · ${esc(MODEL.processes.find(p=>p.id===id)?.name||'')}</option>`).join('')}</select></label>`:''}<label>Link evidence <select aria-label="Relationship evidence source" onchange="CURRENT.evidence=this.value;CURRENT.page=0;CURRENT.selected=null;CURRENT.detail=null;render(false)"><option value="all" ${CURRENT.evidence==='all'?'selected':''}>All evidence layers</option><option value="documented" ${CURRENT.evidence==='documented'?'selected':''}>Documented sources (O/P)</option><option value="official" ${CURRENT.evidence==='official'?'selected':''}>Official case only (O)</option></select></label>${['J5_core','J5_touch'].includes(CURRENT.scope)?`<label class="matrix-toggle"><input aria-label="Include PX06" type="checkbox" ${CURRENT.px?'checked':''} onchange="CURRENT.px=this.checked;CURRENT.page=0;CURRENT.detail=null;CURRENT.selected=null;render(false)"/> PX06</label>`:''}${dim==='people'?`<label>View <select aria-label="People type" onchange="setPeople(this.value)"><option value="actors" ${CURRENT.people==='actors'?'selected':''}>22 actors</option><option value="teams" ${CURRENT.people==='teams'?'selected':''}>17 functional groups</option></select></label>`:''}<label>Rows · Y <select aria-label="Row visibility" onchange="setRowMode(this.value)"><option value="related" ${CURRENT.rowMode==='related'?'selected':''}>Related only</option><option value="all" ${CURRENT.rowMode==='all'?'selected':''}>Show all processes</option></select></label><label>Columns · X <select aria-label="Column visibility" onchange="setColumnMode(this.value)"><option value="related" ${CURRENT.columnMode==='related'?'selected':''}>Related only</option><option value="all" ${CURRENT.columnMode==='all'?'selected':''}>Show all catalog items</option></select></label>${!['issues'].includes(dim)?`<label>Find <input class="matrix-search" aria-label="Find column" placeholder="ID or label" value="${esc(CURRENT.query)}" onchange="setQuery(this.value)"/></label>`:''}</div><div class="matrix-meta"><span><b>${pids.length}</b> / ${scopeRows.length} process rows · <b>${all.length}</b> columns (${cols.length} on page) · <b>${visible.length}</b> visible links</span><span>${pages>1?`Columns ${CURRENT.page*18+1}–${Math.min(all.length,(CURRENT.page+1)*18)} of ${all.length} · rows follow current page`:((CURRENT.scope==='all'&&dim==='issues')?'Full issues catalog':'')}</span></div>${['J6','J6_core','J6_touch'].includes(CURRENT.scope)?`<div class="infoNote matrix-warning"><b>J6 review — not a verified SOP.</b> PR21 = provider readiness; PR22 = first productive customer use. S4 issue associations: PR21↔I01/I07 and PR22↔I01 [M]. All six candidate tasks and actor assignments remain [H]. No verified J6 readiness signoff or J6-specific handoff is cataloged. O/P filters hide M/H links, not the official issues themselves.</div>`:''}${['J7_core','J7_touch'].includes(CURRENT.scope)?`<div class="infoNote matrix-warning"><b>J7 draft evidence boundary.</b> S4 has 7 core PR23–PR29 with 21 Level B task records. P cards describe public capabilities, H cards are candidate tasks; neither verifies Emnify staff execution, ownership, or SOP sequence. Issues I02/I08 link analytically to PR24/PR25 [M].</div>`:''}${scenarioCaution}${dim==='people'&&CURRENT.people==='teams'?`<div class="infoNote matrix-warning"><b>Functional groups are not a verified Emnify org chart.</b> ${CURRENT.columnMode==='related'?'Only groups with visible process links are shown.':'Catalog groups are shown as reference entities, including source-described roles; blank cells are NOT verified team-to-process assignments.'} ${CURRENT.evidence!=='all'?'The official/documented source filter applies to PROCESS relationships separately from the existence of a role.':''}</div>`:''}${dim==='issues'&&CURRENT.evidence!=='all'&&!visible.length?`<div class="infoNote matrix-warning"><b>The 8 problem statements are official [O], but the S4 process associations are model-only [M].</b> The selected source filter hides those links. <button class="btn small" onclick="showIssueModel()" style="margin-left:8px">Show analytical associations ↗</button></div>`:''}${!pids.length&&cols.length?`<div class="infoNote matrix-warning"><b>No process rows have visible links to these columns.</b> ${CURRENT.evidence==='all'?'Try a different scope or column page.':'The selected source layer contains no qualifying process-to-item association on this page.'} <button class="btn small" onclick="setRowMode('all')" style="margin-left:8px">Show all processes ↗</button></div>`:''}${!cols.length?`<div class="infoNote matrix-warning"><b>${CURRENT.columnMode==='related'?'No relationships visible under these filters.':'No catalog items qualify for this source filter.'}</b> This does not mean the roles, entities or connections do not exist. ${CURRENT.columnMode==='related'?`<button class="btn small" onclick="setColumnMode('all')" style="margin-left:8px">Show all catalog items ↗</button>`:'Switch to All evidence layers to browse analytical records.'}</div>`:''}<div class="matrix-layout"><div class="matrix-box"><div class="matrix-scroll"><table class="matrix"><thead><tr><th>Processes · Y ↗</th>${cols.map(c=>`<th>${colLabel(c)}</th>`).join('')}</tr></thead><tbody>${pids.map(pid=>{let pp=MODEL.processes.find(p=>p.id===pid);return `<tr><td class="labelcell"><button title="Inspect ${esc(pid)}" onclick="openLinkedProcess('${pid}')">${esc(pid)} ↗</button><small>${esc(pp?.name||pid)}</small></td>${cols.map(c=>`<td>${matrixCell(pid,c.id)}</td>`).join('')}</tr>`}).join('')}</tbody></table></div><div class="matrix-bottom"><div class="legend"><span><i class="ldot O"></i>Case · source-stated</span><span><i class="ldot P"></i>Product · source-stated</span><span><i class="ldot M"></i>S1/S4 · analytical</span><span><i class="ldot H"></i>S4 · hypothesis</span></div>${pages>1?`<div class="pager"><button class="btn small" ${CURRENT.page===0?'disabled':''} onclick="setPage(CURRENT.page-1)">← Prev</button><span class="mini">${CURRENT.page+1} / ${pages}</span><button class="btn small" ${CURRENT.page>=pages-1?'disabled':''} onclick="setPage(CURRENT.page+1)">Next →</button></div>`:''}</div></div><aside class="inspect" id="issue-inspector-anchor">${matrixInspector()}</aside></div><div class="help">Related only hides unlinked rows and columns for the current source, scope and page. <b>Model links</b> are analytical overlays, never verified causes or team ownership.</div></div>`;
